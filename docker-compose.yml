services:
  client:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_API_URL: ${BACKEND_API_URL:-http://host.docker.internal:8011}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      BACKEND_API_URL: ${BACKEND_API_URL:-http://host.docker.internal:8011}
    ports:
      # The full-stack production client uses 3000; reserve 3001 for this client.
      - "${CLIENT_PORT:-3001}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
