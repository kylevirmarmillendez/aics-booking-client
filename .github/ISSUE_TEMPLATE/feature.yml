name: Feature request
description: Propose brand-new functionality or user-facing capability.
title: "[Feature]: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a new capability. The equivalent conventional label is `feat`.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user or operational need should this feature address?
      placeholder: Describe the need and who is affected.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the capability you would like added.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the conditions that would make this feature complete.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, examples, API considerations, or related issues.
