name: Enhancement
description: Improve, optimize, or expand existing functionality.
title: "[Enhancement]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: What does the existing feature do today?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Proposed improvement
      description: What should change and how would it improve the experience or system?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the conditions that would make this enhancement complete.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, performance data, or related issues.
